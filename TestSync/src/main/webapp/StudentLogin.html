
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Login</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="CSS/StudentLogin.css" rel="stylesheet">

</head>

<body>

	<div class="container">

		<div class="row justify-content-center">

			<div class="col-12 col-sm-10 col-md-7 col-lg-5">

				<div class="login-card">
					<a href="Home.html" class="back-btn"> <i
						class="bi bi-arrow-left-circle-fill"></i>
					</a>

					<h2 class="text-center">Student Login Here</h2>

					<h1 class="text-center mb-4">Good To See You</h1>

					<form action="UserLoginS" name="frm" method="post">

						<label class="mb-2"> User Name </label> <input name="uName"
							type="text" class="form-control mb-3" required> <label
							class="mb-2"> Password </label> <input type="password"
							name="password" class="form-control mb-4" autocomplete="off"
							required>

						<div class="d-flex justify-content-center">

							<button class="btn btn-light fw-bold">Login</button>

						</div>

						<div class="row mt-4 links">

							<div class="col-6">
								<a href="StudentRegisteration.html"> Don't have an account?
								</a>
							</div>

							<div class="col-6 text-end">

								<a href=""> Forgot password? </a>

							</div>

						</div>

					</form>

				</div>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Registration</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: linear-gradient(to right, #74ebd5, #ACB6E5);
	min-height: 100vh;
	margin: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 20px;
}

.register-card {
	background: #0d6efd;
	color: white;
	border-radius: 20px;
	padding: 35px;
	box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.3);
	width: 100%;
	max-width: 450px;
}

.register-card h2 {
	font-weight: bold;
}

.form-control {
	height: 48px;
	border-radius: 10px;
	border: none;
}

.form-control:focus {
	box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.btn-light {
	font-weight: bold;
	border-radius: 10px;
	width: 100%;
	height: 48px;
}

.btn-light:hover {
	background: #f1f1f1;
}

.login-link {
	text-align: center;
	margin-top: 20px;
}

.login-link a {
	color: white;
	text-decoration: none;
	font-size: 15px;
}

.login-link a:hover {
	text-decoration: underline;
}
</style>

</head>

<body>

	<div class="container">

		<div class="row justify-content-center">

			<div class="col-12 col-sm-10 col-md-7 col-lg-5">

				<div class="register-card">

					<h2 class="text-center mb-4">Student Register Here</h2>

					<form action="registerstudent" method="post">

						<input type="text" name="studName" placeholder="Enter Name"
							class="form-control mb-3" autocomplete="off" required> 
						<input type="email" autocomplete="off"
							name="email" placeholder="Enter Email" class="form-control mb-3"
							required>
						<input type="text" autocomplete="off" name="username"
							placeholder="Enter Username" class="form-control mb-3" required>
						<input type="password" name="password" autocomplete="off"
							placeholder="Enter Password" class="form-control mb-3" required>
						<select id="choosecourse" name="subjectId" class="form-select mb-3 required">
							<option value="">Select course</option>

						</select> <input type="text" autocomplete="off" name="mobile"
							placeholder="Enter Mobile Number" class="form-control mb-4"
							required> <input type="submit" name="btnRegister"
							value="Register" class="btn btn-light">

						<div class="login-link">

							<a href="StudentLogin.html"> Already Have an Account? Login
								Here </a>

						</div>

					</form>

				</div>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src=".JS/StudentRegister.js"></script>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Form</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: linear-gradient(to right, #74ebd5, #ACB6E5);
	height: 100vh;
	margin: 0;
	display: flex;
	justify-content: center;
	align-items: center;
}

.login-card {
	background: #0d6efd;
	color: white;
	border-radius: 20px;
	padding: 40px;
	box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.3);
	width: 100%;
	max-width: 400px;
}

.login-card h2 {
	font-weight: bold;
}

.form-control {
	height: 45px;
	border-radius: 10px;
	border: none;
}

.form-control:focus {
	box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

.btn-light {
	font-weight: bold;
	border-radius: 10px;
	width: 100%;
	height: 45px;
}

.btn-light:hover {
	background: #f1f1f1;
}
</style>

</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container">
			<a class="navbar-brand fw-bold" href="#">TestSync</a>

			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a class="nav-link active" href="#">Home</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="#">About</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="#">Courses</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" href="#">Contact</a>
					</li>
				</ul>

				<a href="AdminLogin.html" class="btn btn-outline-light ms-3">Admin Login</a>
				<a href="StudentLogin.html" class="btn btn-primary ms-2">Student Login</a>
			</div>
		</div>
	</nav>


	<div class="container d-flex justify-content-center align-items-center">

		<div class="col-12 col-sm-10 col-md-6 col-lg-4">

			<div class="login-card">

				<h2 class="text-center mb-4">
					Admin Login Here
				</h2>

				<form action="validateadmin" method="post">

					<input type="email"
						name="email"
						placeholder="Enter email"
						class="form-control mb-3"
						required>

					<input type="password"
						name="password"
						placeholder="Enter Password"
						class="form-control mb-4"
						required>

					<div class="d-flex justify-content-center">

						<input type="submit"
							name="s"
							value="Login"
							class="btn btn-light px-4">

					</div>

				</form>

			</div>

		</div>

	</div>

	<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
	</script>

</body>
</html>

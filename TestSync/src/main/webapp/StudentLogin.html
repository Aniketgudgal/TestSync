<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Login</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: linear-gradient(to right, #74ebd5, #ACB6E5);
	height: 100vh;
	margin: 0;
	display: flex;
	justify-content: center;
	align-items: center;
}

.login-card {
	background: #0d6efd;
	color: white;
	border-radius: 20px;
	padding: 40px;
	box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.3);
	width: 100%;
	max-width: 450px;
}

.login-card h1, .login-card h2 {
	font-weight: bold;
}

.form-control {
	height: 45px;
	border-radius: 10px;
	border: none;
}

.form-control:focus {
	box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.btn-light {
	font-weight: bold;
	border-radius: 10px;
	width: 100%;
	height: 45px;
}

.btn-light:hover {
	background: #f1f1f1;
}

.links a {
	color: white;
	text-decoration: none;
	font-size: 14px;
}

.links a:hover {
	text-decoration: underline;
}
</style>

</head>

<body>

	<div class="container">

		<div class="row justify-content-center">

			<div class="col-12 col-sm-10 col-md-7 col-lg-5">

				<div class="login-card">

					<h2 class="text-center">Student Login Here</h2>

					<h1 class="text-center mb-4">Good To See You</h1>

					<form action="UserLoginS" name="frm" method="post">

						<label class="mb-2"> User Name </label> <input name="uName"
							type="text" class="form-control mb-3" required> <label
							class="mb-2"> Password </label> <input type="password"
							name="password" class="form-control mb-4" autocomplete="off"
							required>

						<div class="d-flex justify-content-center">

							<button class="btn btn-light fw-bold">Login</button>

						</div>

						<div class="row mt-4 links">

							<div class="col-6">
								<a href="StudentRegisteration.html"> Don't have an account?
								</a>
							</div>

							<div class="col-6 text-end">

								<a href=""> Forgot password? </a>

							</div>

						</div>

					</form>

				</div>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>
</html>

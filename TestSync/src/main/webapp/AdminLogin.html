<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body {
	background: linear-gradient(to right, #74ebd5, #ACB6E5); 
	margin: 0; 
	min-height: 100vh;
}

.login-container {
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}

.login-card {
	background: #0d6efd;
	color: white;
	border-radius: 20px;
	padding: 40px;
	box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.3);
	width: 100%;
	max-width: 400px;
	position: relative;
}

.back-btn {
	position: absolute;
	top: 20px;
	left: 20px;
	font-size: 24px;
	color: white;
	text-decoration: none;
	transition: 0.3s;
}

.back-btn:hover {
	color: #dcdcdc;
	transform: translateX(-5px);
}

.login-card h2 {
	font-weight: bold;
	margin-top: 20px;
}

.form-control {
	height: 45px;
	border-radius: 10px;
	border: none;
}

.form-control:focus {
	box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

.btn-light {
	font-weight: bold;
	border-radius: 10px;
	width: 100%;
	height: 45px;
}

.btn-light:hover {
	background: #f1f1f1;
}
</style>

</head>

<body>

	<div class="container login-container">

		<div class="row justify-content-center w-100">

			<div class="col-12 col-sm-10 col-md-6 col-lg-4">

				<div class="login-card">

				 
					<a href="Home.html" class="back-btn"> <i
						class="bi bi-arrow-left-circle-fill"></i>
					</a>

					<h2 class="text-center mb-4">Admin Login Here</h2>

					<form action="validateadmin" method="post">

						<input type="email" name="email" placeholder="Enter Email"
							class="form-control mb-3" required> <input
							type="password" name="password" placeholder="Enter Password"
							class="form-control mb-4" required> <input type="submit"
							value="Login" class="btn btn-light">

					</form>

				</div>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>
</html>
